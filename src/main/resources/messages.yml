prefix: "<dark_gray>[<gradient:blue:aqua>ChatColor<dark_gray>] "
color-applied: "<prefix><green>Color <reset><color> <gray>has been applied!"
color-created: "<prefix><green>Custom color '<gray><name><green>' has been created!"
color-reset: "<prefix><gray>Your chat color has been <red>reset<gray>."
no-permission: "<prefix><red>You don't have permission to use that color."
no-permission-command: "<prefix><red>You don't have permission to use this command."
unknown-color: "<prefix><red>Unknown color key: <gray><key>"
config-reloaded: "<prefix><green>Configuration reloaded successfully."
invalid-usage: "<prefix><red>Usage: <gray><usage>"
player-only: "<prefix><red>This command can only be used by players."
usage-set: "/color set <color|gradient|pattern> <key>"
usage-create: "/color create <name> <tag> <icon> [permission]"

gui:
  titles:
    main: "<gradient:blue:aqua><bold>ChatColor"
    solid: "<aqua><bold>Solid Colors"
    gradient: "<gradient:red:blue><bold>Gradients"
    pattern: "<rainbow><bold>Patterns"
    default: "<white>Colors"
  status:
    selected: "<green><bold>SELECTED"
    click-to-apply: "<gray>Click to apply this color."
    has-access: "<green>✔ <gray>You have access."
    no-access: "<gray>You need permission:"
  items:
    solid:
      name: "<green><bold>Solid Colors"
      lore:
        - "<gray>Browse and apply solid colors"
        - "<gray>and hex RGB colors."
    gradient:
      name: "<gradient:red:blue><bold>Gradients"
      lore:
        - "<gray>Apply smooth gradient colors"
        - "<gray>across your messages."
    pattern:
      name: "<rainbow><bold>Patterns"
      lore:
        - "<gray>Apply cycling color patterns"
        - "<gray>character by character."
    reset:
      name: "<red><bold>Reset Color"
      lore:
        - "<gray>Remove your current chat color."
    previous-page:
      name: "<yellow><bold>← Previous Page"
      lore:
        - "<gray>Page <current> / <total>"
    next-page:
      name: "<yellow><bold>Next Page →"
      lore:
        - "<gray>Page <current> / <total>"
    back-menu:
      name: "<red><bold>← Back to Main Menu"
      lore:
        - "<gray>Return to the color category menu."

update-notifier:
  - "<prefix><green>Update available!</green>"
  - "<gray>Current: <red><current_version> <gray>| New: <green><new_version>"
  - "<aqua>Click here to download the latest version"