gui:
  main-menu-title: "<gradient:blue:aqua><bold>ChatColor"
  color-selector-title: "<aqua><bold>Solid Colors"
  gradient-selector-title: "<gradient:red:blue><bold>Gradients"
  pattern-selector-title: "<rainbow><bold>Patterns"

settings:
  apply-to-message: true
  apply-to-name: false
  default-color: "NONE"
  # Group-based default colors. Players with 'chatcolor.group.<name>' will get the specified color.
  # Higher in the list = higher priority.
  group-defaults:
    admin: "<gradient:red:gold>"
    vip: "<aqua>"
  # HIGHEST is recommended for compatibility with plugins like LPC or DiscordSRV.
  event-priority: "HIGHEST"
  papi-integration: true
  late-bind: false
  # Strips color codes from console output to keep it readable.
  clean-console: true
