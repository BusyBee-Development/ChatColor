############################################################
#                    ChatColor Config                      #
############################################################

# Main settings for the ChatColor plugin.

settings:
  # Whether to apply the selected color to the player's chat messages.
  apply-to-message: true
  
  # Whether to apply the selected color to the player's display name.
  apply-to-name: false
  
  # The default color to use if a player hasn't selected one.
  # Set to "NONE" to disable default colors.
  default-color: "NONE"
  
  # Group-based default colors. 
  # Players with 'chatcolor.group.<name>' permission will get the specified color.
  # The list is prioritized from top to bottom.
  group-defaults:
    admin: "<gradient:red:gold>"
    vip: "<aqua>"

  # The priority of the chat listener.
  # Options: LOWEST, LOW, NORMAL, HIGH, HIGHEST, MONITOR, or DEFAULT (auto-detect)
  #
  # DEFAULT resolves to HIGHEST whenever the modern chat hook is in use, because that hook
  # colours from a chat renderer and the last plugin to install one wins. On the legacy hook
  # it resolves to HIGHEST only when a known formatter (EssentialsChat, LPC, DeluxeChat) is
  # running, and NORMAL otherwise.
  #
  # Only override this if another plugin is fighting ChatColor for the renderer. Run
  # "/color debug" and check ourRendererStillInstalled before changing it.
  event-priority: "DEFAULT"

  # Which chat event ChatColor hooks into. Paper only; Spigot always uses LEGACY.
  #
  #   AUTO   - Recommended. MODERN on Paper, LEGACY on Spigot.
  #   MODERN - Always use Paper's AsyncChatEvent. ChatColor colours the message from a
  #            chat renderer, which runs after every listener has finished, so plugins
  #            that strip colour codes out of chat cannot eat ours.
  #   LEGACY - Always use AsyncPlayerChatEvent. Only needed if a plugin cancels chat on
  #            the legacy event and you need ChatColor to run before it. Colours written
  #            here can still be stripped by anything reading the modern event later,
  #            EssentialsChat included.
  #
  # Only ONE chat listener is ever registered. AsyncChatEvent fires for every message on
  # Paper regardless: with no legacy listeners Paper fires it directly, and with legacy
  # listeners Paper runs AsyncPlayerChatEvent first and feeds the result into it. That
  # makes MODERN both safe and always last in the chain.
  chat-hook: "AUTO"

  # Whether to use late-binding for placeholders.
  # Enable this if you use %chatcolor_message% in other plugin formats
  # and want to avoid double-processing.
  late-bind: false
    
  # Strips color codes from console output to keep it readable.
  clean-console: true

  # Centralized toggles to easily hide standard elements.
  show-standard-colors: true
  show-standard-gradients: true
  show-standard-patterns: true
