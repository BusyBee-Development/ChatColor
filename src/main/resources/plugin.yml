name: ChatColor
version: ${project.version}
main: net.busybee.chatcolor.ChatColor
api-version: '1.21'
folia-supported: true
author: djtmk
# Every plugin ChatColor hooks into or detects, so they load first.
softdepend:
  - PlaceholderAPI
  - HeadDatabase
  - Essentials
  - EssentialsChat
  - EssentialsC
  - LPC
  - LPC-Pro
  - DeluxeChat
  - ChatManager
  - ZelChat
description: A chat color plugin for Minecraft Paper and Folia servers.

commands:
  color:
    description: Open the color selector GUI or manage your chat color.
    usage: /color [set <type> <key> | reset | list | reload | create | delete | gui | debug]
    permission: chatcolor.use
    aliases:
      - chatcolor
      - colors

permissions:
  chatcolor.use:
    description: Allows the player to use the color GUI and basic commands.
    default: true
  chatcolor.gui.solid:
    description: Access to the Solid Colors section in the GUI.
    default: true
  chatcolor.gui.gradient:
    description: Access to the Gradients section in the GUI.
    default: true
  chatcolor.gui.pattern:
    description: Access to the Patterns section in the GUI.
    default: true

  chatcolor.reload:
    description: Allows reloading the plugin configuration.
    default: op
  chatcolor.create:
    description: Allows creating and deleting custom colors via command.
    default: op
  chatcolor.admin:
    description: Allows setting or resetting another player's color.
    default: op
  chatcolor.debug:
    description: Allows running /color debug to trace the chat pipeline in the console.
    default: op
  chatcolor.color.*:
    description: Access to all standard solid colors.
    default: op
  chatcolor.gradient.*:
    description: Access to all standard gradients.
    default: op
  chatcolor.pattern.*:
    description: Access to all patterns.
    default: op
  chatcolor.custom.*:
    description: Access to all custom colors defined in colors.yml.
    default: op
  chatcolor.set.hex:
    description: Allows choosing any hex color via /chatcolor set color <hexcode>.
    default: false

  chatcolor.minimessage:
    description: Allows using MiniMessage tags and legacy color codes in chat.
    default: false