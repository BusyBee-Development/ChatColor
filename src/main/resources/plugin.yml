name: ChatColor
version: ${project.version}
main: net.busybee.chatcolor.ChatColor
api-version: '1.21'
folia-supported: true
canvas-supported: true
author: BusyBee
softdepend: [PlaceholderAPI, Essentials, EssentialsChat]
description: Advanced chat color plugin with gradient and pattern support.

commands:
  color:
    description: Open the color selector GUI or manage your chat color.
    usage: /color [set <type> <key> | reset | reload | create | gui]
    permission: chatcolor.use
    aliases:
      - chatcolor
      - cc

permissions:
  chatcolor.use:
    description: Allows the player to use the color GUI and basic commands.
    default: true
  chatcolor.gui.solid:
    description: Access to the Solid Colors section in the GUI.
    default: true
  chatcolor.gui.gradient:
    description: Access to the Gradients section in the GUI.
    default: true
  chatcolor.gui.pattern:
    description: Access to the Patterns section in the GUI.
    default: true

  chatcolor.reload:
    description: Allows reloading the plugin configuration.
    default: op
  chatcolor.create:
    description: Allows creating custom colors via command.
    default: op
  chatcolor.color.*:
    description: Access to all solid colors.
    default: op
  chatcolor.gradient.*:
    description: Access to all gradients.
    default: op
  chatcolor.pattern.*:
    description: Access to all patterns.
    default: op
  chatcolor.minimessage:
    description: Allows using MiniMessage tags and legacy color codes in chat.
    default: false