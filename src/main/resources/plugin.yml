name: ChatColor
version: ${project.version}
main: net.busybee.chatcolor.ChatColor
api-version: '1.21'
folia-supported: true
canvas-supported: true
author: BusyBee
softdepend: [PlaceholderAPI, Essentials, EssentialsChat, EssentialsC]
description: Advanced chat color plugin with gradient and pattern support.

commands:
  color:
    description: Open the color selector GUI or manage your chat color.
    usage: /color [set <type> <key> | reset | list | reload | create | delete | gui]
    permission: chatcolor.use
    aliases:
      - chatcolor
      - cc

permissions:
  chatcolor.use:
    description: Allows the player to use the color GUI and basic commands.
    default: true
  chatcolor.gui.solid:
    description: Access to the Solid Colors section in the GUI.
    default: true
  chatcolor.gui.gradient:
    description: Access to the Gradients section in the GUI.
    default: true
  chatcolor.gui.pattern:
    description: Access to the Patterns section in the GUI.
    default: true

  chatcolor.reload:
    description: Allows reloading the plugin configuration.
    default: op
  chatcolor.create:
    description: Allows creating and deleting custom colors via command.
    default: op
  chatcolor.admin:
    description: Allows setting or resetting another player's color.
    default: op

  # The wildcards below are filled in at runtime. Every color, gradient, pattern and
  # custom color defined in colors/colors.yml and colors/patterns.yml is registered as a
  # real permission on startup and added as a child of its wildcard, so owners can define
  # their own colors without touching this file and "chatcolor.custom.*" still works in
  # LuckPerms.
  chatcolor.color.*:
    description: Access to all standard solid colors.
    default: op
  chatcolor.gradient.*:
    description: Access to all standard gradients.
    default: op
  chatcolor.pattern.*:
    description: Access to all patterns.
    default: op
  chatcolor.custom.*:
    description: Access to all custom colors defined in colors.yml.
    default: op

  chatcolor.minimessage:
    description: Allows using MiniMessage tags and legacy color codes in chat.
    default: false