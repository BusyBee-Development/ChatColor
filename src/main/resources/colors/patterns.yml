############################################################
#                   ChatColor Patterns                     #
############################################################

# Define multi-color patterns here.
# Colors are applied character-by-character. Spaces never take a color.
#
# 'mode' (optional) sets how the colors are handed out:
#   CYCLE           - Each letter takes the next color in the list, looping. The default.
#   RANDOM          - Each letter takes a random color from the list, never the same one
#                     twice in a row. Changes on every chat message.
#   RANDOM_GRADIENT - Each chat message fades between two colors picked at random from
#                     the list. Needs at least two plain colors (e.g. "<red>", "<#FF0000>").
# The random modes only ever use the colors you list, so keep them readable on chat.
# Display names and placeholders other than %chatcolor_message% keep one fixed look per
# player instead of changing, so names don't flicker in the tab list.
#
# Like colors.yml, each entry takes an optional 'permission' (leave it empty to let
# everyone use the pattern) and an optional 'default' of true, op or false. Every node
# is registered with the server on startup so "chatcolor.pattern.*" works in LuckPerms.
#
# Each entry also accepts an optional 'hdb-id' - a HeadDatabase head ID to use as the
# icon instead of 'icon'. Requires the HeadDatabase plugin; falls back to 'icon' if it's
# not installed or the ID can't be resolved. Example: hdb-id: "7129"

patterns:
  rainbow:
    display-name: "Rainbow"
    permission: "chatcolor.pattern.rainbow"
    icon: "YELLOW_WOOL"
    colors:
      - "<red>"
      - "<gold>"
      - "<yellow>"
      - "<green>"
      - "<aqua>"
      - "<blue>"
      - "<light_purple>"
  fire:
    display-name: "Fire"
    permission: "chatcolor.pattern.fire"
    icon: "MAGMA_BLOCK"
    colors:
      - "<#FF4500>"
      - "<#FF6000>"
      - "<#FF8C00>"
      - "<#FFA500>"
      - "<#FFD700>"
  ice:
    display-name: "Ice"
    permission: "chatcolor.pattern.ice"
    icon: "PACKED_ICE"
    colors:
      - "<#B0E0E6>"
      - "<#ADD8E6>"
      - "<#87CEEB>"
      - "<#87CEFA>"
      - "<#00BFFF>"
  galaxy:
    display-name: "Galaxy"
    permission: "chatcolor.pattern.galaxy"
    icon: "PURPLE_CONCRETE"
    colors:
      - "<#0D47A1>"
      - "<#4A148C>"
      - "<#880E4F>"
      - "<#4A148C>"
      - "<#6A1B9A>"
      - "<#1A237E>"
  toxic:
    display-name: "Toxic"
    permission: "chatcolor.pattern.toxic"
    icon: "SLIME_BLOCK"
    colors:
      - "<#39FF14>"
      - "<#7FFF00>"
      - "<#ADFF2F>"
      - "<#00FF7F>"
  cherry:
    display-name: "Cherry"
    permission: "chatcolor.pattern.cherry"
    icon: "PINK_PETALS"
    colors:
      - "<#FF69B4>"
      - "<#FF1493>"
      - "<#DB7093>"
      - "<#FFB6C1>"
      - "<#FF69B4>"
  confetti:
    display-name: "Confetti"
    permission: "chatcolor.pattern.confetti"
    icon: "FIREWORK_ROCKET"
    mode: "RANDOM"
    colors:
      - "<#FF5555>"
      - "<#FFAA00>"
      - "<#FFFF55>"
      - "<#55FF55>"
      - "<#55FFFF>"
      - "<#FF55FF>"
  mood:
    display-name: "Mood"
    permission: "chatcolor.pattern.mood"
    icon: "AMETHYST_SHARD"
    mode: "RANDOM_GRADIENT"
    colors:
      - "<#FF6B6B>"
      - "<#FFD93D>"
      - "<#6BCB77>"
      - "<#4D96FF>"
      - "<#C77DFF>"
