############################################################
#                    ChatColor Colors                      #
############################################################

# Define solid colors and gradients here.
#
# Every entry supports these fields:
#   display-name : The name shown in the GUI.
#   tag          : The color itself. Any MiniMessage tag works - "<red>", "<#FF69B4>" or
#                  "<gradient:red:gold>". Legacy codes like "&c" are accepted too.
#   icon         : The material to show in the GUI.
#   hdb-id       : Optional. A HeadDatabase (https://www.spigotmc.org/resources/14280/) head
#                  ID to use as the icon instead of 'icon' - browse IDs on minecraft-heads.com.
#                  Requires the HeadDatabase plugin; falls back to 'icon' if it's not
#                  installed or the ID can't be resolved. Example: hdb-id: "7129"
#   permission   : The node a player needs. Leave it empty ("") to let EVERYONE use the
#                  entry with no permission at all. It does not have to start with
#                  "chatcolor." - "vip.colors.royal" works just as well.
#   default      : Optional. Who holds the node when nobody has granted or revoked it.
#                    true  - everyone has it unless you revoke it
#                    op    - operators only (this is the default)
#                    false - nobody has it until you grant it
#
# Every node listed in this file is registered with the server on startup, so wildcard
# grants such as "chatcolor.color.*" and "chatcolor.custom.*" work in LuckPerms and
# friends, and the nodes show up in permission tab-completion.

# Standard Colors
colors:
