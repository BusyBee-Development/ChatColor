# User Created Colors
#
# Add your own colors here, or use:
#   /color create <name> <tag> <icon> [permission|none] [true|op|false]
#   /color delete <name>
#   /color list custom
#
# Example - a VIP-only gradient, and a color anyone can use:
#
#   royal:
#     display-name: "Royal"
#     tag: "<gradient:#4B0082:#9370DB>"
#     icon: "PURPLE_WOOL"
#     permission: "vip.colors.royal"
#     default: "false"
#   plain:
#     display-name: "Plain"
#     tag: "<#DDDDDD>"
#     icon: "WHITE_WOOL"
#     permission: ""
custom-colors: {}